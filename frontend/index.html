<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auslan Sign Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%9F%3C/text%3E%3C/svg%3E">
<style>
    * { box-sizing: border-box; }
    :root {
        --bg: #101216; --panel: #171a21; --line: #262b35;
        --ink: #e8ecf3; --dim: #8b94a6;
        --body: #7ee8c8; --left: #ff8f6b; --right: #6fb4ff; --accent: #2f6fd0;
        --ok: #2f8a68; --warn: #c28f2c; --spell: #3a6db0;
    }
    body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Arial, sans-serif;
        display: grid; grid-template-columns: 330px 1fr; height: 100vh; overflow: hidden;
    }
    aside {
        background: var(--panel); border-right: 1px solid var(--line);
        padding: 18px 16px; overflow-y: auto;
    }
    aside h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
    aside p  { font-size: 12px; color: var(--dim); margin: 0 0 12px; }
    aside h2 { font-size: 12.5px; color: var(--dim); margin: 18px 0 6px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-top: 1px solid var(--line); padding-top: 14px; }
    aside h2 .tag { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11px;
                    color: var(--warn); margin-left: 6px; }
    .sentbox { display: flex; gap: 6px; margin-bottom: 4px; }
    .sentbox input, .glossline {
        flex: 1; min-width: 0; padding: 8px 10px; font-size: 13px;
        border: 1px solid var(--line); border-radius: 7px;
        background: #1e222b; color: var(--ink);
    }
    .glossline { width: 100%; font: 12px/1.4 ui-monospace, monospace; padding: 6px 8px; }
    .sentbox input::placeholder { color: #565d6d; }
    .sentbox button {
        padding: 8px 12px; font-size: 13px; font-weight: 600; border: 0;
        border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer;
        white-space: nowrap;
    }
    .sentbox button:hover { filter: brightness(1.15); }
    .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); margin: 6px 0 0; }
    .opts label { cursor: pointer; user-select: none; }
    .plan { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; }
    .plan .empty { font-size: 12px; color: #565d6d; }
    .chip { border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px;
            padding: 2px 6px 3px; background: #1e222b; max-width: 100%; }
    .chip .en { display: block; font-size: 10.5px; color: var(--dim); line-height: 1.25;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .chip select { background: transparent; color: var(--ink); border: 0; padding: 0;
                   font: 600 12px/1.3 ui-sans-serif, system-ui, sans-serif; cursor: pointer;
                   max-width: 240px; }
    .chip select option { background: #1e222b; color: var(--ink); }
    .chip.sign { border-left-color: var(--ok); }
    .chip.spell { border-left-color: var(--spell); }
    .chip.uncertain { border-left-color: var(--warn); background: #29231a; }
    .chip.omit { opacity: .5; }
    .chip.omit select { text-decoration: line-through; }
    .chip.low .en::after { content: " · low tracking"; color: var(--warn); }
    .chip.reviewed .en::after { content: " · reviewed ✓"; color: var(--ok); }
    .chip.active { outline: 2px solid var(--ink); outline-offset: 1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--dim); margin-bottom: 10px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .legend .sign { background: var(--ok); } .legend .uncertain { background: var(--warn); }
    .legend .spell { background: var(--spell); } .legend .omit { background: #3a3f4a; }
    .glabel { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
    #plan-notes { font-size: 11.5px; color: #d9b36c; margin-top: 6px; }
    #plan-notes div { margin-bottom: 3px; }
    #plan-notes .summary { color: var(--dim); }
    .words { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .words button {
        padding: 8px 6px; font-size: 12px; font-weight: 600; letter-spacing: .03em;
        border: 1px solid var(--line); border-radius: 7px;
        background: #1e222b; color: var(--ink); cursor: pointer; text-transform: uppercase;
    }
    .words button:hover { border-color: #3d4556; background: #242935; }
    .words button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
    .words button.pending { color: #5d6575; border-style: dashed; }
    main { position: relative; display: flex; flex-direction: column; min-width: 0; }
    #stage { flex: 1; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #word {
        position: absolute; left: 28px; top: 22px; font-size: 34px; font-weight: 700;
        letter-spacing: .06em; text-transform: uppercase; right: 300px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sub { position: absolute; left: 30px; top: 66px; right: 300px; color: var(--dim); font-size: 12.5px; }
    #sentence { position: absolute; left: 30px; bottom: 18px; right: 310px; font-size: 16px;
                letter-spacing: .01em; line-height: 1.5; }
    #sentence .w { color: #4a5266; margin-right: 7px; }
    #sentence .w.active { color: var(--ink); font-weight: 700; }
    #reference {
        position: absolute; right: 22px; bottom: 22px; width: 260px;
        border-radius: 10px; border: 1px solid var(--line); background: #000; display: block;
    }
    #reflabel {
        position: absolute; right: 22px; bottom: 22px; transform: translateY(-100%);
        margin-bottom: 6px; font-size: 11px; color: var(--dim); letter-spacing: .08em;
    }
    footer {
        border-top: 1px solid var(--line); background: var(--panel);
        padding: 12px 22px; display: flex; align-items: center; gap: 12px;
    }
    footer button {
        padding: 9px 18px; font-size: 14px; border: 0; border-radius: 7px;
        background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
    }
    footer button.ghost { background: #2a2f3a; }
    footer select { background: #1e222b; color: var(--ink); border: 1px solid var(--line);
                    border-radius: 6px; padding: 5px 6px; font-size: 12.5px; }
    #scrub { flex: 1; min-width: 60px; accent-color: var(--accent); }
    #count { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px;
             min-width: 92px; text-align: right; }
    label.toggle { color: var(--dim); font-size: 12.5px; cursor: pointer; user-select: none; }
    @media (max-width: 760px) {
        body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: 100dvh; }
        aside { max-height: 46dvh; border-right: 0; border-bottom: 1px solid var(--line); }
        #reference { width: 120px; right: 10px; bottom: 10px; }
        #reflabel { display: none; }
        #word { font-size: 22px; left: 16px; top: 10px; right: 140px; }
        #sub { left: 16px; top: 42px; right: 140px; }
        #sentence { left: 16px; right: 140px; bottom: 10px; font-size: 13px; }
        footer { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
    }
</style>
</head>
<body>

<aside>
    <h1>Auslan sign library</h1>
    <p id="libstat">loading…</p>

    <h2>Type a sentence</h2>
    <div class="sentbox">
        <input type="text" id="sentence-input" placeholder="e.g. Pay your bill tomorrow"
               autocomplete="off">
        <button id="sentence-go">▶ Play</button>
    </div>
    <div class="opts">
        <label title="Time words first; wh-word last in a question. Common Auslan patterns, applied mechanically.">
            <input type="checkbox" id="order" checked> Auslan word order (heuristic)</label>
        <label title="Cut each clip's leading/trailing rest pose so signs flow into each other.">
            <input type="checkbox" id="trim" checked> trim rest between signs</label>
    </div>

    <h2>Sign plan <span class="tag">rule-based · not verified by a signer</span></h2>
    <div id="plan" class="plan"><span class="empty">Type something above, or pick a sign below.</span></div>
    <div class="legend"><span><i class="sign"></i>sign</span><span><i class="uncertain"></i>check the sense</span>
        <span><i class="spell"></i>fingerspelled</span><span><i class="omit"></i>omitted</span></div>
    <label class="glabel" for="glossline">Gloss line — edit, then Enter to play exactly this</label>
    <input id="glossline" class="glossline" spellcheck="false" autocomplete="off"
           placeholder="hello my fs:NAME fs:SABIN">
    <div id="plan-notes"></div>

    <h2>Quick signs</h2>
    <div class="words" id="words"></div>

    <h2>Fingerspelled phrases</h2>
    <div class="words" id="fingerspell-words"></div>
</aside>

<main>
    <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="word">—</div>
        <div id="sub">select a sign</div>
        <div id="sentence"></div>
        <div id="reflabel">SOURCE VIDEO</div>
        <video id="reference" muted playsinline preload="auto"></video>
    </div>
    <footer>
        <button id="play">▶ Play</button>
        <button id="replay" class="ghost">↻ Replay</button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="position">
        <select id="speed" aria-label="speed">
            <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
            <option value="1" selected>1×</option><option value="1.25">1.25×</option>
        </select>
        <label class="toggle"><input type="checkbox" id="loop" checked> loop</label>
        <span id="count">—</span>
    </footer>
</main>

<script type="module">
// ======================================================
// 2D Auslan player.
//
// No retargeting here, deliberately. The landmarks are already in image
// space, which is the space a 2D figure lives in -- drawing them
// directly is exact by construction, and the whole class of bugs that
// comes with mapping onto a 3D skeleton (rest poses, bone axes, limb
// proportions) simply does not arise.
//
//   src/planner.js  English -> sign plan (rule-based, every step explained)
//   src/library.js  manifest lookup, lazy loading + cache, normalisation
//   src/timeline.js many clips -> one continuous timeline
//   this file       drawing, playback, and the editable plan UI
// ======================================================
import { plan as makePlan, toGlossLine, fromGlossLine } from "./src/planner.js";
import { Library } from "./src/library.js";
import { buildTimeline, sample, allFrames } from "./src/timeline.js";

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const video = $("reference");
const wordEl = $("word");
const subEl = $("sub");
const scrub = $("scrub");
const countEl = $("count");
const loopEl = $("loop");
const playBtn = $("play");

let lib = null;
let quick = {};            // signs.json: quick-pick signs + pre-stitched phrases
let faceTopo = null;       // assets/signs/face_topology.json
let currentPlan = null;    // what is shown in the plan editor
let tl = null;             // the timeline being played
let layout = null;         // ONE camera for the whole timeline
let playing = false, startClock = 0, tNow = 0, speed = 1;
let dirty = true;          // paused, but something changed: draw again
let scrubStep = 1;         // ms of timeline per pixel of slider: smaller moves are invisible

// Write text only when it changes. An unchanged write still costs a style
// recalculation and a layout -- 60 of each per second during playback.
function setText(el, text) {
    if (el.textContent !== text) el.textContent = text;
}
let buildSeq = 0, videoClip = -1, activeStep = -1;

// ---- MediaPipe topology -------------------------------------------
const POSE = {
    NOSE: 0, L_EYE: 2, R_EYE: 5,
    L_SHOULDER: 11, R_SHOULDER: 12, L_ELBOW: 13, R_ELBOW: 14,
    L_WRIST: 15, R_WRIST: 16, L_HIP: 23, R_HIP: 24
};
const TORSO = [[11, 12], [11, 23], [12, 24], [23, 24]];
const HAND_LINKS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
];

// ======================================================
// LAYOUT
//
// Computed once per sign from the whole clip, not per frame: fitting to
// each frame's own extent would make the figure breathe as the arms
// move. One transform for the clip keeps it still.
// ======================================================
function computeLayout(motion) {
    const aspect = motion.width / motion.height;
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;

    const see = (x, y) => {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    };

    for (const frame of motion.frames) {
        const p = frame.pose;
        if (!p) continue;
        for (const i of [POSE.NOSE, POSE.L_SHOULDER, POSE.R_SHOULDER,
                         POSE.L_ELBOW, POSE.R_ELBOW, POSE.L_WRIST, POSE.R_WRIST,
                         POSE.L_HIP, POSE.R_HIP]) {
            see(p[i].x * aspect, p[i].y);
        }
        for (const key of ["left_hand", "right_hand"]) {
            const h = frame[key];
            if (!h) continue;
            for (const lm of h) see(lm.x * aspect, lm.y);
        }
        if (frame.face) for (const lm of frame.face) see(lm.x * aspect, lm.y);
    }
    // Centre on the BODY, not on the full extent. A raised arm reaches
    // further to one side than the other, and centring on that pushes
    // the figure off to the opposite side of the frame. The box is
    // widened symmetrically about the torso instead, so the signer stays
    // put and the arm still fits.
    let cx = 0, n = 0;
    for (const frame of motion.frames) {
        const p = frame.pose;
        if (!p) continue;
        cx += (p[POSE.L_SHOULDER].x + p[POSE.R_SHOULDER].x +
               p[POSE.L_HIP].x + p[POSE.R_HIP].x) / 4 * aspect;
        n++;
    }
    cx = n ? cx / n : (minX + maxX) / 2;

    const half = Math.max(maxX - cx, cx - minX) * 1.16 + 0.04;
    const padTop = (maxY - minY) * 0.28 + 0.04;
    const padBottom = (maxY - minY) * 0.10 + 0.03;
    return { aspect,
             minX: cx - half, maxX: cx + half,
             minY: minY - padTop, maxY: maxY + padBottom };
}

function project(x, y, layout, W, H) {
    const boxW = layout.maxX - layout.minX;
    const boxH = layout.maxY - layout.minY;
    const scale = Math.min(W / boxW, H / boxH);
    const offX = (W - boxW * scale) / 2;
    const offY = (H - boxH * scale) / 2;
    return [offX + (x * layout.aspect - layout.minX) * scale,
            offY + (y - layout.minY) * scale];
}

// ======================================================
// DRAWING
// ======================================================
function limb(a, b, width, colour) {
    ctx.strokeStyle = colour;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
}

function dot(p, r, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
    ctx.fill();
}

function drawFrame(frame, layout) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    if (!frame || !frame.pose) return;

    const p = frame.pose;
    const P = i => project(p[i].x, p[i].y, layout, W, H);
    const unit = Math.min(W, H);
    const thick = unit * 0.022;

    // ---- torso as a filled shape, so the figure reads as a body -----
    const ls = P(POSE.L_SHOULDER), rs = P(POSE.R_SHOULDER);
    const lh = P(POSE.L_HIP), rh = P(POSE.R_HIP);
    ctx.fillStyle = "rgba(126,232,200,0.13)";
    ctx.beginPath();
    ctx.moveTo(ls[0], ls[1]); ctx.lineTo(rs[0], rs[1]);
    ctx.lineTo(rh[0], rh[1]); ctx.lineTo(lh[0], lh[1]);
    ctx.closePath(); ctx.fill();

    for (const [a, b] of TORSO) limb(P(a), P(b), thick * 0.8, "#7ee8c8");
    // The pose model and the hand model each estimate the wrist. Drawing the
    // forearm to one and the hand from the other left a visible gap, so
    // when a hand is present and attached (its wrist within 0.35 shoulder
    // widths of the arm's), the forearm ends at the hand's own wrist point.
    // Both are measurements; this only picks the one arm and hand share.
    const swPx = Math.hypot(ls[0] - rs[0], ls[1] - rs[1]) || 1;
    const wristFor = (key, wristIndex) => {
        const h = frame[key], w = P(wristIndex);
        if (!h || h.length !== 21) return w;
        const root = project(h[0].x, h[0].y, layout, W, H);
        return Math.hypot(root[0] - w[0], root[1] - w[1]) <= 0.35 * swPx ? root : w;
    };
    const wristL = wristFor("left_hand", POSE.L_WRIST), wristR = wristFor("right_hand", POSE.R_WRIST);
    limb(P(POSE.L_SHOULDER), P(POSE.L_ELBOW), thick, "#ff8f6b");
    limb(P(POSE.L_ELBOW), wristL, thick, "#ff8f6b");
    limb(P(POSE.R_SHOULDER), P(POSE.R_ELBOW), thick, "#6fb4ff");
    limb(P(POSE.R_ELBOW), wristR, thick, "#6fb4ff");

    // ---- head ------------------------------------------------------
    const nose = P(POSE.NOSE);
    const neck = [(ls[0] + rs[0]) / 2, (ls[1] + rs[1]) / 2];
    const headR = Math.max(unit * 0.035, Math.hypot(nose[0] - neck[0], nose[1] - neck[1]) * 0.72);
    limb(neck, nose, thick * 0.7, "#7ee8c8");
    if (frame.face && faceTopo) {
        drawFace(frame.face, layout, W, H, thick);
    } else {
        ctx.fillStyle = "#0f1318";
        ctx.strokeStyle = "#7ee8c8";
        ctx.lineWidth = thick * 0.55;
        ctx.beginPath();
        ctx.arc(nose[0], nose[1] - headR * 0.15, headR, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
    }

    for (const i of [POSE.L_SHOULDER, POSE.R_SHOULDER, POSE.L_ELBOW, POSE.R_ELBOW])
        dot(P(i), thick * 0.52, "#cfe8ff");

    // ---- hands -----------------------------------------------------
    for (const [key, colour, wristIndex] of
         [["left_hand", "#ff8f6b", POSE.L_WRIST], ["right_hand", "#6fb4ff", POSE.R_WRIST]]) {
        const h = frame[key];
        if (!h || h.length !== 21) {
            dot(wristIndex === POSE.L_WRIST ? wristL : wristR, thick * 0.6, colour);
            continue;
        }
        const Q = i => project(h[i].x, h[i].y, layout, W, H);
        for (const [a, b] of HAND_LINKS) limb(Q(a), Q(b), thick * 0.42, colour);
        for (let i = 0; i < 21; i++) {
            const tip = (i % 4 === 0 && i > 0);
            dot(Q(i), thick * (tip ? 0.30 : 0.20), tip ? "#ffffff" : colour);
        }
    }
}


// The face from the source clip's own landmarks: outline, brows, eyes,
// lips. Brow position and mouth shape carry grammar in Auslan; a circle
// for a head shows none of it. Drawn only where the clip has a tracked
// face -- letters and the pre-stitched phrases fall back to the circle.
function drawFace(face, layout, W, H, thick) {
    const F = i => project(face[i].x, face[i].y, layout, W, H);
    ctx.fillStyle = "#0f1318";
    ctx.strokeStyle = "#7ee8c8";
    ctx.lineWidth = thick * 0.45;
    ctx.beginPath();
    faceTopo.oval_loop.forEach((i, k) => {
        const p = F(i);
        if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();

    const lines = (edges, width, colour) => {
        ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.lineCap = "round";
        ctx.beginPath();
        for (const [a, b] of edges) {
            const p = F(a), q = F(b);
            ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
        }
        ctx.stroke();
    };
    const parts = faceTopo.parts;
    lines(parts.left_eyebrow, thick * 0.3, "#e8ecf3");
    lines(parts.right_eyebrow, thick * 0.3, "#e8ecf3");
    lines(parts.left_eye, thick * 0.16, "#cfe8ff");
    lines(parts.right_eye, thick * 0.16, "#cfe8ff");
    lines(parts.lips, thick * 0.2, "#f2a3b6");
}

// ======================================================
// FINGERSPELLING PROGRESS
//
// A fingerspelled word is read letter by letter, so the count alone
// ("143 / 330") tells a viewer nothing useful. This highlights which
// letter the current frame belongs to, using the boundaries the
// stitcher recorded -- not re-derived or guessed on the client.
// ======================================================
function drawLetterProgress(letters, index) {
    const activeIdx = letters.findIndex(l => index >= l.start && index < l.end);
    setText(subEl, letters.map((l, i) =>
        i === activeIdx ? l.letter : l.letter.toLowerCase()
    ).join(" – "));
}

// ======================================================
// SENTENCE PROGRESS
//
// A sentence needs two levels a single fingerspelled word does not: which
// WORD is active, and which LETTER within that word. The big title tracks
// the word (so it reads like a caption changing every ~1-2s), #sub shows
// that word spelled out with its active letter capitalised, and #sentence
// gives the full word sequence as fixed context so a viewer isn't lost
// about what came before or what's next.
// ======================================================
function drawSentenceProgress(words, letters, index) {
    const activeWord = words.findIndex(w => index >= w.start && index < w.end);
    if (activeWord === -1) return;

    setText(wordEl, words[activeWord].word);

    const ownLetters = letters.filter(l => l.word === words[activeWord].word
        && index >= words[activeWord].start && index < words[activeWord].end);
    const wordLetters = letters.filter((l, i) => {
        // letters carrying this exact word occurrence -- match by contiguous
        // range membership, since a word (e.g. "TWENTY") can repeat
        return l.start >= words[activeWord].start && l.end <= words[activeWord].end;
    });
    const activeLetterIdx = wordLetters.findIndex(l => index >= l.start && index < l.end);
    setText(subEl, wordLetters.map((l, i) =>
        i === activeLetterIdx ? l.letter : l.letter.toLowerCase()
    ).join(" – "));

    // rebuilt only when the active word changes, not 60 times a second
    const sentenceEl = document.getElementById("sentence");
    const key = `phrase:${activeWord}/${words.length}`;
    if (sentenceEl.dataset.key !== key) {
        sentenceEl.dataset.key = key;
        sentenceEl.innerHTML = words.map((w, i) =>
            `<span class="w${i === activeWord ? " active" : ""}">${w.word}</span>`
        ).join("");
    }
}

function resize() {
    const stage = document.getElementById("stage");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    dirty = true;            // resizing clears the canvas
    if (tl) scrubStep = Math.max(1, scrub.max / Math.max(1, scrub.clientWidth));
}
window.addEventListener("resize", resize);


// ======================================================
// PLAN -> CLIPS -> TIMELINE
//
// Every way of playing something -- typed sentence, edited plan, gloss
// line, quick-pick button -- produces a plan, and every plan is played the
// same way. Only the signs a plan uses are fetched (lazily, cached).
// ======================================================
const lettersOf = s => (s || "").toUpperCase().replace(/[^A-Z]/g, "").split("").filter(Boolean);
const lettersFor = step => (step.letters && step.letters.length) ? step.letters : lettersOf(step.en);

async function clipsFor(step) {
    const full = c => [0, c.motion.frames.length - 1];
    const tag = (c, li = 0) => ({ ...c, step: step.n, li,
        span: ($("trim").checked || c.kind === "phrase") ? c.span : full(c) });
    if (step.kind === "sign") return [tag(await lib.sign(step.id))];
    if (step.kind === "spell") {
        const cs = await Promise.all(step.letters.map(ch => lib.letter(ch)));
        return cs.map((c, i) => tag(c, i));
    }
    if (step.kind === "phrase") return [tag(await lib.phrase(step.id))];
    return [];
}

async function playPlan(p) {
    const seq = ++buildSeq;
    currentPlan = p;
    renderPlan();
    pause();
    subEl.textContent = "loading…";
    const results = await Promise.allSettled(p.steps.map(clipsFor));
    if (seq !== buildSeq) return;            // superseded by a newer request
    const clips = [], failed = [];
    results.forEach((r, i) => r.status === "fulfilled" ? clips.push(...r.value)
                                                       : failed.push(p.steps[i]));
    if (failed.length) {
        addNote(`could not load: ${failed.map(s => s.gloss || s.en).join(", ")}`);
    }
    if (!clips.length) {
        tl = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        wordEl.textContent = "—";
        subEl.textContent = "nothing to sign";
        countEl.textContent = "—";
        return;
    }
    tl = buildTimeline(clips);
    layout = computeLayout({ width: 1, height: 1, frames: [...allFrames(tl)] });
    scrub.max = Math.round(tl.duration * 1000);
    scrubStep = Math.max(1, scrub.max / Math.max(1, scrub.clientWidth));
    videoClip = -1; activeStep = -1;
    tNow = 0;
    dirty = true;
    play();
}

// ======================================================
// PLAYBACK
//
// One clock drives the figure, the captions and the video. The timeline
// position comes from elapsed time x speed; the video is told where to be,
// never asked, so a dropped video frame cannot drag the figure out of step.
// ======================================================
function play() {
    if (!tl) return;
    if (tNow >= tl.duration - 1e-3) tNow = 0;
    startClock = performance.now() - tNow / speed * 1000;
    playing = true;
    videoClip = -1;                          // force a video re-sync
    playBtn.textContent = "❚❚ Pause";
}

function pause() {
    playing = false;
    dirty = true;
    playBtn.textContent = "▶ Play";
    video.pause();
}

function render() {
    requestAnimationFrame(render);
    if (!tl) return;
    const looping = loopEl.checked;
    if (playing) {
        tNow = (performance.now() - startClock) / 1000 * speed;
        // looping plays the wrap transition (last pose -> first) up to loopEnd
        const end = looping ? tl.loopEnd : tl.duration;
        if (tNow >= end) {
            if (looping) {
                tNow %= end;
                startClock = performance.now() - tNow / speed * 1000;
                videoClip = -1;
            } else { tNow = tl.duration; pause(); }
        }
        // moving the slider costs a layout; only move it when the thumb would
        const ms = Math.round(Math.min(tNow, tl.duration) * 1000);
        if (Math.abs(ms - scrub.value) >= scrubStep) scrub.value = ms;
    } else if (!dirty) {
        return;                  // paused and nothing changed: the canvas is already right
    }
    const s = sample(tl, (playing && looping) ? tNow : Math.min(tNow, tl.duration - 1e-6));
    drawFrame(s.frame, layout);
    const settled = syncVideo(s);
    caption(s);
    setText(countEl, `${Math.min(tNow, tl.duration).toFixed(1)} / ${tl.duration.toFixed(1)}s`);
    dirty = !playing && !settled;    // keep going while a paused video catches up
}

function syncVideo(s) {
    const c = tl.clips[s.clip];
    if (s.local === null) {                  // a transition: no source frame
        if (!video.paused) video.pause();
        return true;
    }
    const want = s.local / c.motion.fps;
    if (videoClip !== s.clip) {
        videoClip = s.clip;
        if (video.getAttribute("src") !== c.video) video.src = c.video;
        video.playbackRate = speed;
        video.currentTime = want;
        if (playing) video.play().catch(() => {});
        return false;
    }
    // While a load or seek is in flight, currentTime still reads the OLD
    // position; correcting "drift" then would issue a new seek every frame,
    // each restarting the load, and the video would never show at all.
    if (video.seeking || video.readyState < 2) return false;
    if (playing) {
        if (video.paused) { video.currentTime = want; video.play().catch(() => {}); }
        else if (Math.abs(video.currentTime - want) > 0.25) video.currentTime = want;
        return true;
    }
    if (!video.paused) video.pause();
    if (Math.abs(video.currentTime - want) > 0.02) { video.currentTime = want; return false; }
    return true;
}

// ======================================================
// CAPTIONS: the gloss being signed (big), how (small), and the typed
// English with the words this sign comes from highlighted.
// ======================================================
function caption(s) {
    const c = tl.clips[s.clip];
    const step = currentPlan.steps[c.step];
    if (step.n !== activeStep) setActiveStep(step.n);

    if (c.kind === "phrase") {
        const m = c.motion;
        if (s.local === null) return;
        if (m.words) drawSentenceProgress(m.words, m.letters, s.local);
        else {
            setText(wordEl, c.label);
            if (m.letters) drawLetterProgress(m.letters, s.local);
        }
        return;
    }
    if (step.kind === "sign") {
        setText(wordEl, step.gloss);
        const notes = [];
        if (step.uncertain) notes.push("⚠ check: " + step.why);
        else if (step.match === "stem" || step.match === "keyword" || step.reviewed) notes.push(step.why);
        if (step.flags && step.flags.length) notes.push("⚠ tracking: " + step.flags.join(", "));
        else if (step.low) notes.push("low tracking quality in the source clip");
        if (s.local === null) notes.unshift("transition");
        setText(subEl, notes.join(" · "));
    } else if (step.kind === "spell") {
        setText(wordEl, step.letters.join(""));
        setText(subEl, "fingerspelled: " + step.letters
            .map((l, i) => i === c.li ? l : l.toLowerCase()).join(" – "));
    }
}

function setActiveStep(n) {
    activeStep = n;
    for (const chip of document.querySelectorAll("#plan .chip"))
        chip.classList.toggle("active", +chip.dataset.n === n);
    const step = currentPlan.steps[n];
    const el = $("sentence");
    if (currentPlan.tokens && currentPlan.tokens.length) {
        el.innerHTML = "";
        el.dataset.key = "";
        currentPlan.tokens.forEach((t, i) => {
            const w = document.createElement("span");
            w.className = "w" + (step.src && step.src.includes(i) ? " active" : "");
            w.textContent = t;
            el.appendChild(w);
        });
    } else if (step.kind !== "phrase") {
        el.innerHTML = "";
        el.dataset.key = "";
        currentPlan.steps.filter(x => x.kind !== "omit").forEach(x => {
            const w = document.createElement("span");
            w.className = "w" + (x.n === n ? " active" : "");
            w.textContent = x.kind === "sign" ? x.gloss : x.letters.join("");
            el.appendChild(w);
        });
    }
}

// ======================================================
// PLAN EDITOR
//
// Each step is a chip with a menu of everything it could be: every
// candidate sign for its word (with ones not yet extracted shown but
// disabled), fingerspelling, or omitting it. Changing one marks it
// "reviewed" and replays. This is the human-correction path: the planner
// proposes, a person who knows Auslan decides.
// ======================================================
function chipClass(step) {
    return ["chip", step.kind, step.uncertain ? "uncertain" : "",
            step.low && step.kind === "sign" ? "low" : "",
            step.reviewed ? "reviewed" : ""].filter(Boolean).join(" ");
}

function renderPlan() {
    const p = currentPlan;
    const el = $("plan");
    el.innerHTML = "";
    for (const step of p.steps) {
        const chip = document.createElement("div");
        chip.className = chipClass(step);
        chip.dataset.n = step.n;
        chip.title = step.why || "";
        const en = document.createElement("span");
        en.className = "en";
        en.textContent = (step.moved ? `↔ ${step.moved}: ` : "") + (step.en || " ");
        const sel = document.createElement("select");
        sel.setAttribute("aria-label", `sign for "${step.en || ""}"`);
        const add = (value, text, disabled = false) => {
            const o = document.createElement("option");
            o.value = value; o.textContent = text; o.disabled = disabled;
            sel.appendChild(o);
        };
        const seen = new Set();
        if (step.kind === "sign") { add(`sign:${step.id}`, step.gloss); seen.add(step.id); }
        for (const o of step.options || []) {
            if (seen.has(o.id)) continue;
            seen.add(o.id);
            add(`sign:${o.id}`, o.gloss + (!o.available ? " · not extracted yet"
                : o.status === "unreliable" ? " · unreliable tracking"
                : o.status === "review" ? " · tracking flagged"
                : o.low ? " · low tracking" : ""), !o.available);
        }
        if (step.kind === "phrase") add(`phrase:${step.id}`, step.en);
        const letters = lettersFor(step);
        if (letters.length) add("spell", `fingerspell ${letters.join("")}`);
        add("omit", step.en ? `omit “${step.en}”` : "omit");
        sel.value = step.kind === "sign" ? `sign:${step.id}` : step.kind === "spell" ? "spell"
                  : step.kind === "phrase" ? `phrase:${step.id}` : "omit";
        sel.addEventListener("change", () => edit(step.n, sel.value));
        chip.append(en, sel);
        el.appendChild(chip);
    }

    const gl = $("glossline");
    const hasPhrase = p.steps.some(s => s.kind === "phrase");
    gl.disabled = hasPhrase;
    gl.value = hasPhrase ? "" : toGlossLine(p);
    gl.placeholder = hasPhrase ? "(pre-stitched phrase — not editable)" : "hello my fs:NAME fs:SABIN";

    const notes = $("plan-notes");
    notes.innerHTML = "";
    const n = k => p.steps.filter(s => s.kind === k).length;
    const flagged = p.steps.filter(s => s.uncertain).length;
    const summary = [`${n("sign")} sign${n("sign") === 1 ? "" : "s"}`,
                     `${n("spell")} fingerspelled`, `${n("omit")} omitted`];
    if (flagged) summary.push(`${flagged} to check`);
    if (!hasPhrase) addNote(summary.join(" · "), "summary");
    for (const s of p.notes || []) addNote(s);
    const pending = p.steps.filter(s => s.pending);
    if (pending.length) addNote(`exists in the corpus but not extracted yet: ` +
        pending.map(s => s.pending).join(", ") + ` — python3 scripts/build_library.py --only ` +
        pending.map(s => s.pending).join(" "));
}

function addNote(text, cls) {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    $("plan-notes").appendChild(d);
}

function edit(n, value) {
    const s = currentPlan.steps[n];
    s.origWhy ??= s.why;
    if (value.startsWith("sign:")) {
        const info = lib.byId(value.slice(5));
        Object.assign(s, { kind: "sign", id: info.id, gloss: info.gloss, key: info.keys[0],
                           low: info.low || !!info.status, flags: info.flags || [],
                           letters: lettersFor(s) });
    } else if (value === "spell") {
        Object.assign(s, { kind: "spell", letters: lettersFor(s) });
    } else if (value === "omit") {
        s.letters = lettersFor(s);
        s.kind = "omit";
    }
    Object.assign(s, { uncertain: false, reviewed: true, pending: null,
                       why: `set by reviewer — planner said: ${s.origWhy}` });
    playPlan(currentPlan);
}

// ======================================================
// ENTRY POINTS
// ======================================================
function clearPressed() {
    for (const b of document.querySelectorAll(".words button")) b.setAttribute("aria-pressed", "false");
}

function playTyped() {
    const text = $("sentence-input").value.trim();
    if (!text || !lib) return;
    clearPressed();
    playPlan(makePlan(text, lib, { auslanOrder: $("order").checked }));
}

function playGlossLine() {
    const line = $("glossline").value.trim();
    if (!line || !lib) return;
    clearPressed();
    playPlan(fromGlossLine(line, lib));
}

function quickPlan(name) {
    const e = quick[name];
    const base = { text: name, tokens: [], question: null, notes: [], verified: false };
    if (e.library) {
        const info = lib.byId(e.library);
        const options = lib.candidates(info.keys[0]).map(o => ({ id: o.id, gloss: o.gloss,
            sense: o.sense, available: o.available, low: o.low, status: o.status }));
        if (!info.available) {
            return { ...base, steps: [{ n: 0, kind: "spell", letters: lettersOf(info.keys[0]),
                en: name.toLowerCase(), src: [], options, pending: info.id,
                why: `sign ${info.gloss} exists but is not extracted yet -- fingerspelled` }] };
        }
        return { ...base, steps: [{ n: 0, kind: "sign", id: info.id, gloss: info.gloss,
            key: info.keys[0], match: "exact", uncertain: false,
            low: info.low || !!info.status, flags: info.flags || [],
            en: name.toLowerCase(), src: [], options, letters: lettersOf(info.keys[0]),
            why: "quick pick" }] };
    }
    return { ...base, steps: [{ n: 0, kind: "phrase", id: name, en: name, src: [], options: [],
                                why: "pre-stitched fingerspelled phrase" }] };
}

function playQuick(name) {
    for (const b of document.querySelectorAll(".words button"))
        b.setAttribute("aria-pressed", String(b.dataset.word === name));
    playPlan(quickPlan(name));
}

$("sentence-go").addEventListener("click", playTyped);
$("sentence-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); playTyped(); }
});
$("glossline").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); playGlossLine(); }
});
$("order").addEventListener("change", () => {
    if (currentPlan && currentPlan.tokens.length) playTyped();
});
$("trim").addEventListener("change", () => { if (currentPlan) playPlan(currentPlan); });

playBtn.addEventListener("click", () => {
    if (!tl) return;
    if (playing) pause(); else play();
});
$("replay").addEventListener("click", () => { tNow = 0; play(); });

scrub.addEventListener("input", () => {
    if (!tl) return;
    pause();
    tNow = +scrub.value / 1000;
    dirty = true;
});

$("speed").addEventListener("change", () => {
    speed = +$("speed").value;
    video.playbackRate = speed;
    if (playing) startClock = performance.now() - tNow / speed * 1000;
});

window.addEventListener("keydown", e => {
    // Space toggles playback -- but never while typing in a field, where it
    // must stay a space
    if (e.key !== " " || e.target.closest("input, select, textarea, button")) return;
    e.preventDefault();
    playBtn.click();
});

// ======================================================
// START
// ======================================================
// Module scope isn't global scope, so nothing above is reachable from
// the console (or a test harness) without an explicit hook.
window.auslan = {
    get lib() { return lib; },
    get plan() { return currentPlan; },
    get timeline() { return tl; },
    get t() { return tNow; },
    get playing() { return playing; },
    get activeStep() { return activeStep; },
    say: text => { $("sentence-input").value = text; playTyped(); },
    gloss: line => { $("glossline").value = line; playGlossLine(); },
    quick: name => playQuick(name),
    edit: (n, value) => edit(n, value),
    seek: t => { pause(); tNow = t; dirty = true; },
};

(async function start() {
    resize();
    render();
    const get = async (url, fallback) => {
        try {
            const r = await fetch(url, { cache: "no-cache" });
            return r.ok ? await r.json() : fallback;
        } catch (e) { return fallback; }
    };
    const [manifest, letters, signs, topo, keywords] = await Promise.all([
        get("./assets/signs/manifest.json", null), get("./assets/fingerspelling/letters.json", {}),
        get("./assets/signs.json", {}), get("./assets/signs/face_topology.json", null),
        get("./assets/signs/keywords.json", null)]);
    faceTopo = topo;
    quick = signs;
    const phrases = Object.fromEntries(Object.entries(signs).filter(([, e]) => e.motion));
    lib = new Library({ manifest, letters, phrases, keywords });

    const c = manifest ? manifest.counts : null;
    $("libstat").textContent = !c
        ? "assets/signs/manifest.json missing — run: python3 scripts/build_library.py"
        : `${c.available.toLocaleString()} of ${c.signs.toLocaleString()} corpus signs extracted` +
          (c.available < c.signs ? " (extraction in progress — reload for more)" : "") +
          ` · A–Z fingerspelling` + (c.low_quality ? ` · ${c.low_quality} flagged low tracking` : "");

    const grid = $("words"), fsGrid = $("fingerspell-words");
    for (const name of Object.keys(signs)) {
        const button = document.createElement("button");
        button.textContent = name;
        button.dataset.word = name;
        button.setAttribute("aria-pressed", "false");
        if (signs[name].library && !lib.byId(signs[name].library)?.available) {
            button.classList.add("pending");
            button.title = "not extracted yet — plays fingerspelled";
        }
        button.addEventListener("click", () => playQuick(name));
        (signs[name].fingerspell ? fsGrid : grid).appendChild(button);
    }
    subEl.textContent = "type a sentence, or pick a sign";

    // ?text=... plans and plays a sentence; ?gloss=... plays an exact gloss
    // line (what llm_plan.py prints). Shareable links to a specific sentence.
    const q = new URLSearchParams(location.search);
    if (q.get("gloss")) { $("glossline").value = q.get("gloss"); playGlossLine(); }
    else if (q.get("text")) { $("sentence-input").value = q.get("text"); playTyped(); }
})();
</script>
</body>
